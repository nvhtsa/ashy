<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ashy, mwl</title>
  <link rel="icon" href="assets/img/favicon.ico?v=2" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png?v=2" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png?v=2" />
  <meta name="theme-color" content="#0c0914" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=10" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="ashy, mwl" />
  <meta property="og:description" content="personal project" />
  <meta property="og:url" content="https://ashy.lol" />
  <meta property="og:image" content="https://ashy.lol/assets/img/embed.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ashy, mwl" />
  <meta name="twitter:description" content="personal project" />
  <meta name="twitter:image" content="https://ashy.lol/assets/img/embed.png" />
</head>
<body data-view="home">
  <button id="splash" class="splash" aria-label="Enter site"><canvas id="intro" aria-hidden="true"></canvas>
    <span class="cue" aria-hidden="true"><i class="ring"></i><b>enter</b></span></button>

  <video class="bg-video" autoplay muted loop playsinline preload="auto">
    <source src="assets/media/background.mp4" type="video/mp4" />
  </video>
  <div class="overlay" aria-hidden="true"></div>

  <canvas id="bgOrbs" class="fx" aria-hidden="true"></canvas>
  <div id="cursorGlow" class="cursor-glow" aria-hidden="true"></div>

  <div id="app" class="app">
    <div id="bloom" class="bloom" aria-hidden="true"></div>
    <header class="top">
      <nav aria-label="Pages">
        <a href="/">Home</a>
        <a href="/gear">Gear</a>
        <a href="/settings">Settings</a>
        <a href="/listening">Listening</a>
      </nav>
    </header>

    <main>
      <section data-view="home" class="home">
        <img class="logo" src="assets/img/logo.png" alt="Ashtyn" />
        <div id="socials" class="socials"></div>
      </section>

      <section data-view="gear" hidden>
        <h1>Gear</h1>
        <p class="lede">PC Specs & Peripherals</p>
        <div id="gearList" class="gear"></div>
      </section>

      <section data-view="settings" hidden>
        <h1>Settings</h1>
        <p class="lede">My game settings.</p>
        <div id="settingsList" class="gear"></div>
      </section>

      <section data-view="listening" hidden>
        <h1>Listening</h1>
        <p class="lede" id="npLede"></p>
        <div id="np" class="np"></div>
        <div id="recent" class="recent"></div>
      </section>
    </main>

    <canvas id="viz" class="viz" aria-hidden="true"></canvas>

    <a class="mark" href="/" aria-label="Back to home">ashtyn</a>

    <footer class="player" aria-label="Music player">
      <div id="pQueue" class="queue" role="list" aria-label="Tracklist"></div>
      <div id="pArt" class="cover" aria-hidden="true"><img id="pArtImg" alt="" hidden /><span id="pArtLetter"></span></div>
      <div class="pctl">
        <button id="pPrev" class="ico" aria-label="Previous track" title="Previous">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg>
        </button>
        <button id="pPlay" class="play" aria-label="Play or pause" title="Play / pause">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button id="pNext" class="ico" aria-label="Next track" title="Next">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg>
        </button>
      </div>
      <div class="pmeta">
        <div class="pinfo"><span id="pTitle">Not playing</span><span id="pArtist"></span></div>
        <div class="pseek">
          <span id="pCur">0:00</span>
          <input id="pSeek" type="range" min="0" max="100" value="0" step="0.1" aria-label="Seek" />
          <span id="pDur">0:00</span>
        </div>
      </div>
      <div class="pright">
        <button id="pMute" class="ico" aria-label="Mute" title="Mute">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="waves" d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <input id="pVol" type="range" min="0" max="100" value="15" aria-label="Volume" />
        <button id="pList" class="ico" aria-label="Show tracklist" title="Tracklist" aria-expanded="false" aria-controls="pQueue">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h11M4 12h11M4 18h7"/><path d="M17 14.5v7l6-3.5z" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <audio id="audio" preload="auto"></audio>
  <script src="config.js"></script>
  <script src="playlist.js?v=6cee7de1"></script>
  <script src="app.js?v=ashtyn-cap-20"></script>
  <script src="brand-animation.js?v=1"></script>
</body>
</html>
